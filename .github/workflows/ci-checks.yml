---
name: CI checks
"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  maven-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-21-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-21-maven-
      - name: Build it with Maven
        run: mvn -B install -Dsurefire.rerunFailingTestsCount=2
  xcop-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint XML with xcop
        run: |
          docker run --rm -v "$PWD":/w -w /w ruby:3.3 sh -c \
            "gem install xcop -v 0.11.2 -q && xcop \$(find . \( -name '*.xml' -o -name '*.xsl' -o -name '*.xsd' -o -name '*.xhtml' \) -not -path '*/src/test/resources*/*' -not -path '*/target/*' -not -path './.git/*')"
